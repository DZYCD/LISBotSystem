name: eiar_001
id: agent/eiar_001
network: mqtt
url: broker.emqx.io
port: 1883
auth_key: sk-eiar001
group: EiAr
role: 编程助手
avatar: static/EiAr_001.png
functions: []
tool_list: config/tools.yaml
tools:
- name: file_tree
  access:
    allow:
    - '*'
- name: file_read
  access:
    allow:
    - '*'
- name: file_write
  access:
    allow:
    - '*'
- name: file_create
  access:
    allow:
    - '*'
- name: file_delete
  access:
    allow:
    - '*'
- name: file_copy
  access:
    allow:
    - '*'
- name: file_move
  access:
    allow:
    - '*'
- name: search_text
  access:
    allow:
    - '*'
scheduling:
  mode: concurrent
  max_concurrency: 4
network_healer:
  type: mqtt_healer
  interval: 30
permissions:
  accept_from: []
  reject_from: []
fallback: agent/sayi_996
memory:
  enabled: true
  window_tokens: 200000
system_layers:
- 你是世忆图书馆 LIS 集群的编程助手 eiar_001。你提供 file_read 工具读取文件内容。收到读取文件请求时，调用 file_read 工具，把读到的内容如实返回。
- '本地工具 file_read: 参数 path（文件路径）。用于读取文件内容。'
networks:
- network: mqtt
  url: broker.emqx.io
  port: 1883
  topic: tll/agent/eiar_001
- network: mqtt
  url: 127.0.0.1
  port: 1883
  topic: tll/agent/eiar_001
peers:
  agent/skaye_sv:
    auth_key: sk-sv
  agent/sayi_996:
    bot_id: agent/sayi_996
    auth_key: sk-test
llm:
  enabled: true
  provider: openai
  base_url: https://api.deepseek.com
  api_key:
  model: deepseek-v4-pro
  temperature: 0.3
  max_tokens: 4096
  role_prompt: '你是世忆图书馆 LIS 集群的编程助手。

    你擅长文件操作、代码分析和知识检索。

    请根据用户需求，合理选择工具完成任务。

    '
  style_prompt: '请用中文简洁回复，输出 JSON 格式的 reply 和 commands 数组。

    commands 必须是 JSON 数组（list），用方括号 [] 包裹，不是字典。每个元素格式为 {"func_name": "工具名", "params":
    {"参数名": "值"}}。

    若需指定目标机器人，请在 params 中加入 "target": "机器人ID"。

    当你是对其他机器人消息的回复时，直接返回 reply 文本，不要在 commands 中包含任何 chat_* 指令，也不要委托给 agent/sayi_sv。

    如果是回答委托者的话而不用额外委托，不要使用 command 命令，直接返回 reply 字段。

    '
  context_window: 200000
  compress_threshold: 0.8
  compress_min_turns: 20
  history_enabled: true
